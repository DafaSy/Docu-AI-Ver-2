<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('docuai.workspace.preferences');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.theme === 'light') theme = 'light';
            else if (parsed.theme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>DocuAI — Private document intelligence</title>
    <meta name="description" content="Upload TXT, PDF, and CSV files directly to your n8n workflow." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
